name: Worker checks

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-check.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-check.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install
      - run: npm run typecheck
